
<!-- ================= HERO ================= -->
<section class="hero">
  <!-- background -->
  <div
    class="hero__bg"
    aria-hidden="true"
  ></div>

  <!-- dark gradient overlay -->
  <div class="hero__overlay" aria-hidden="true"></div>

  <!-- content -->
  <div class="hero__content">
    <span class="hero__eyebrow">Subscribe Now</span>

    <h1 class="hero__title">
      Discover Movies<br />
      Made for You
    </h1>

    <p class="hero__description">
      Personalized recommendations, intelligent reviews, and
      hand-picked collections powered by AI.
    </p>

    <div class="hero__actions">
      <a routerLink="/featured" class="btn btn--primary">
        ▶ Watch trailer
      </a>
      <a routerLink="/movies" class="btn btn--secondary">
        Find out more
      </a>
    </div>
  </div>
</section>

<!-- ================= FEATURED MOVIES ================= -->
<section class="featured">
  <div class="featured__container">

    <!-- header -->
    <div class="featured__header">
      <h2>Trending Movies</h2>

      <a routerLink="/movies" class="featured__see-all">
        See all →
      </a>
    </div>

    <!-- cards -->
    <div class="featured__grid">
      <div
        class="movie-card"
        *ngFor="let movie of featuredMovies"
      >
        <div class="movie-card__image">
          <img [src]="movie.poster" [alt]="movie.title" />
        </div>

        <div class="movie-card__content">
          <h3>{{ movie.title }}</h3>
          <p>{{ movie.description }}</p>
        </div>
      </div>
    </div>

  </div>
</section>
